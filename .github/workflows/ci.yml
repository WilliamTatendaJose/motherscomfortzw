name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check and build
        run: npm run build
        env:
          # The build must succeed without any secrets — the site falls back to
          # the static content in src/content when Sanity is not configured.
          NEXT_PUBLIC_SITE_URL: https://motherscomfort.co.zw
